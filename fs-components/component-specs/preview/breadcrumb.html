<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Breadcrumb 面包屑 - 组件预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-family-base); padding: 40px; background: #FFF; color: var(--color-gray-1); }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--color-gray-3); margin-bottom: 40px; }
    .section { margin-bottom: 48px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 24px; padding-bottom: 8px; border-bottom: 1px solid var(--color-gray-5); }
    .demo-label { font-size: 12px; color: var(--color-gray-3); margin-bottom: 12px; }
    .dark-panel { background: #19191A; border-radius: 8px; padding: 24px 20px; margin-top: 24px; }
    .dark-panel .demo-label { color: rgba(255,255,255,0.45); }
  </style>
</head>
<body>
  <h1>Breadcrumb 面包屑</h1>
  <p class="subtitle">面包屑导航 — 常规（浅色背景）/ 反白（深色背景）两种样式，分隔符为 /</p>

  <div class="section">
    <div class="section-title">面包屑样式</div>

    <div class="demo-label">常规 — 浅色背景</div>
    <nav class="ds-breadcrumb" aria-label="Breadcrumb">
      <div class="ds-breadcrumb__item">
        <a href="#" class="ds-breadcrumb__link">Home</a>
        <span class="ds-breadcrumb__separator">/</span>
      </div>
      <div class="ds-breadcrumb__item">
        <a href="#" class="ds-breadcrumb__link">Page A</a>
        <span class="ds-breadcrumb__separator">/</span>
      </div>
      <div class="ds-breadcrumb__item">
        <span class="ds-breadcrumb__current">Current Page</span>
      </div>
    </nav>

    <!-- 反白样式 -->
    <div class="dark-panel">
      <div class="demo-label">反白 — 深色背景</div>
      <nav class="ds-breadcrumb ds-breadcrumb--dark" aria-label="Breadcrumb">
        <div class="ds-breadcrumb__item">
          <a href="#" class="ds-breadcrumb__link">Home</a>
          <span class="ds-breadcrumb__separator">/</span>
        </div>
        <div class="ds-breadcrumb__item">
          <a href="#" class="ds-breadcrumb__link">Page A</a>
          <span class="ds-breadcrumb__separator">/</span>
        </div>
        <div class="ds-breadcrumb__item">
          <span class="ds-breadcrumb__current">Current Page</span>
        </div>
      </nav>
    </div>
  </div>
</body>
</html>
