<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchor Nav 锚点导航 - 组件预览</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <link rel="stylesheet" href="../components.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-family-base); padding: 40px 0; background: #FFF; color: var(--color-gray-1); }
    h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; padding: 0 40px; }
    .subtitle { font-size: 14px; color: var(--color-gray-3); margin-bottom: 40px; padding: 0 40px; }
    .section { margin-bottom: 48px; }
    .section-title { font-size: 18px; font-weight: 600; margin-bottom: 24px; padding: 0 40px 8px; border-bottom: 1px solid var(--color-gray-5); }
    .demo-label { font-size: 12px; color: var(--color-gray-3); margin-bottom: 8px; padding: 0 40px; }
    .placeholder { height: 300px; background: var(--color-gray-9); display: flex; align-items: center; justify-content: center; color: var(--color-gray-3); font-size: 16px; font-weight: 600; }

    /* Dependency Bar */
    .ds-dep-bar { display: flex; align-items: flex-start; gap: 12px; padding: 16px 20px; background: #FAFBFC; border: 1px solid var(--color-gray-5); border-radius: 8px; margin-bottom: 40px; }
    .ds-dep-bar__label { font-size: 12px; font-weight: 600; color: var(--color-gray-3); white-space: nowrap; line-height: 24px; }
    .ds-dep-bar__tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .ds-dep__tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 24px; }
    .ds-dep__tag--token { background: #FFF3E0; color: #E65100; }
    .ds-dep__tag--comp { background: #E8F0FE; color: #1a56db; }
    .ds-dep__tag--icon { background: #F3E8FF; color: #6B21A8; }
  </style>
</head>
<body>
  <h1>Anchor Nav 锚点导航</h1>
  <p class="subtitle">页面内锚点跳转导航条 — 固定在页面顶部，左侧 Tab 选项 + 右侧 CTA 按钮</p>

  <div class="section">
    <div class="section-title">锚点导航</div>
    <div class="demo-label">全宽 1920px，灰底 #EEEEEE，高度 56px</div>

    <div class="ds-anchor-nav" data-anchor-group data-fragment="anchor-nav">
      <div class="ds-anchor-nav__inner">
        <div class="ds-anchor-nav__tabs">
          <div class="ds-anchor-nav__tab ds-anchor-nav__tab--active" data-anchor-tab>Option</div>
          <div class="ds-anchor-nav__tab" data-anchor-tab>Option</div>
          <div class="ds-anchor-nav__tab" data-anchor-tab>Option</div>
        </div>
        <div class="ds-anchor-nav__action">
          <button class="ds-btn ds-btn--filled-red ds-btn--l"><span class="ds-btn__text">Button Name</span></button>
        </div>
      </div>
    </div>

    <div class="placeholder">Page Content Area</div>
  </div>

  <script>
    document.querySelectorAll('[data-anchor-group]').forEach(function(nav) {
      nav.querySelectorAll('[data-anchor-tab]').forEach(function(tab) {
        tab.addEventListener('click', function() {
          nav.querySelectorAll('[data-anchor-tab]').forEach(function(t) { t.classList.remove('ds-anchor-nav__tab--active'); });
          tab.classList.add('ds-anchor-nav__tab--active');
        });
      });
    });
  </script>
</body>
</html>
