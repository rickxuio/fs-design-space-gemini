<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FS Design System</title>
  <link rel="icon" href="design-system/components/icons/icon-logo-fs.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="design-system/components/tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-family-base);
      background: var(--color-white);
      color: var(--color-gray-1);
      -webkit-font-smoothing: antialiased;
    }

    /* ===== Header ===== */
    .site-header {
      background: var(--color-white);
      border-bottom: 1px solid var(--color-gray-5);
      padding: 48px 0 40px;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
    .site-header h1 { font-size: 32px; font-weight: 600; line-height: 40px; }
    .site-header p { font-size: 14px; color: var(--color-gray-3); margin-top: 8px; line-height: 22px; }

    /* ===== Sections ===== */
    .section { padding: 48px 0; }
    .section--gray { background: var(--color-gray-9); }
    .section-label {
      font-size: 12px; font-weight: 600; color: var(--color-gray-3);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 24px;
    }

    /* ===== Tags ===== */
    .tag {
      display: inline-flex; align-items: center; height: 20px; padding: 0 8px;
      border-radius: 4px; font-size: 11px; font-weight: 600; line-height: 20px;
    }
    .tag--ref { background: #E8F5E9; color: #2E7D32; }

    /* ===== Open link ===== */
    .open-link {
      display: inline-flex; align-items: center; gap: 2px;
      font-size: 12px; color: var(--color-blue); text-decoration: none;
    }
    .open-link:hover { text-decoration: underline; }
    .open-link img { width: 12px; height: 12px; }

    /* ===== Guide Card ===== */
    .guide-card {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--color-white); border: 1px solid var(--color-gray-5);
      border-radius: 8px; padding: 32px;
      text-decoration: none; color: inherit;
      transition: box-shadow 0.2s ease;
    }
    .guide-card:hover { box-shadow: 0 15px 15px -10px rgba(0,0,0,0.1); }
    .guide-card__title { font-size: 20px; font-weight: 600; line-height: 28px; margin-bottom: 8px; }
    .guide-card__desc { font-size: 14px; color: var(--color-gray-3); line-height: 22px; max-width: 640px; }
  </style>
</head>
<body><header class="site-header"><div class="container"><h1>FS 统一阅读中心</h1><p>项目说明、页面工作流、布局规范、组件与验收资料，在同一个目录阅读。</p></div></header><main><section class="section"><div class="container"><a href="design-system/component-library.html#view/project" class="guide-card"><div class="guide-card__left"><span class="tag tag--ref">统一入口</span><p class="guide-card__title">打开阅读资料与组件库</p><p class="guide-card__desc">左侧目录切换资料，右侧阅读原规范；组件库沿用现有变体、父子依赖及调用状态。</p></div><span class="open-link">进入 →</span></a></div></section></main></body></html>
