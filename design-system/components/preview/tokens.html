<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Tokens — Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../tokens.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font-family-base); background: #fff; color: var(--color-gray-1); padding: 48px; max-width: 1200px; margin: 0 auto; -webkit-font-smoothing: antialiased; }
    h1 { font-size: 24px; font-weight: 600; line-height: 32px; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: var(--color-gray-3); line-height: 22px; margin-bottom: 48px; }
    .section { margin-bottom: 56px; scroll-margin-top: 24px; }
    .section-title { font-size: 16px; font-weight: 600; line-height: 24px; margin-bottom: 24px; padding-bottom: 12px; border-bottom: 1px solid var(--color-gray-5); }
  </style>
</head>
<body>
  <h1>Design Tokens 设计令牌</h1>
  <p class="subtitle">颜色、字体、间距、描边、圆角、阴影 — 数值实时读取自 tokens.css 中定义的核心 CSS 变量</p>

  <div class="section" id="tok-colors"><h2 class="section-title">颜色 Colors</h2><div id="ds-colors"></div></div>
  <div class="section" id="tok-typography"><h2 class="section-title">字体 Typography</h2><div id="ds-type"></div></div>
  <div class="section" id="tok-spacing"><h2 class="section-title">间距 Spacing</h2><div id="ds-spacing"></div></div>
  <div class="section" id="tok-borders"><h2 class="section-title">描边 Stroke</h2><div id="ds-border"></div></div>
  <div class="section" id="tok-radius"><h2 class="section-title">圆角 Border Radius</h2><div id="ds-radius"></div></div>
  <div class="section" id="tok-shadows"><h2 class="section-title">阴影 Shadows</h2><div id="ds-shadow"></div></div>

  <script src="tokens-data.js?v=20260723-composite-typography"></script>
  <script>
    DSTokens.renderColors('ds-colors');
    DSTokens.renderTypography('ds-type');
    DSTokens.renderSpacing('ds-spacing');
    DSTokens.renderBorders('ds-border');
    DSTokens.renderRadius('ds-radius');
    DSTokens.renderShadows('ds-shadow');
    DSTokens.flashHash();
  </script>
  <script src="preview-link.js"></script>
</body>
</html>
