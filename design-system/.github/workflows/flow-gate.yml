name: FS Delivery Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  delivery-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch pull request base
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
      - name: Run required A/B/C delivery flows
        run: npm run check:delivery -- --mode=ci --base-ref "origin/${{ github.base_ref }}"
        env:
          CHROME_PATH: /usr/bin/google-chrome
