name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            design-system/package-lock.json
      - run: npm ci
      - run: npm run design:install
      - name: Verify generated component adapters
        run: npm run component:check
      - name: Local workflow regression
        run: npm test
      - name: Isolated parent-child maintenance proof
        run: npm run test:sync
        env:
          CHROME_PATH: /usr/bin/google-chrome
      - name: Build local page-level examples
        run: npm run build
      - run: git diff --exit-code -- fs-components/page-specs
      - name: Local static and rendered checks
        run: npm run check
        env:
          CHROME_PATH: /usr/bin/google-chrome
